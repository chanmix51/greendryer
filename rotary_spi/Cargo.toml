[package]
edition      = "2024"
name         = "rotary_spi"
rust-version = "1.88"
version      = "0.1.0"
# src/bin/display.rs and src/bin/encoder.rs are modules of main, not extra binaries.
autobins     = false

[[bin]]
name = "rotary_spi"
path = "./src/bin/main.rs"

[dependencies]
embedded-graphics = { version = "0.8", default-features = false }

# Chip crates are not built for host tests (`cargo test --lib --target <host>`).
[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = ["embassy", "esp32", "log-04"] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time     = { version = "0.5.0", features = ["log"] }
esp-backtrace = { version = "0.19.0", features = [
  "esp32",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32", "log-04"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

embassy-sync     = "0.8"
embedded-hal-bus = { version = "0.3", default-features = false }
mipidsi          = { version = "0.9", default-features = false }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
